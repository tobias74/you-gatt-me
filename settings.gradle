pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "YouGattMe"
include ':app'
include ':simulator-core'

def localSettings = file("local.settings.gradle")
if (!providers.gradleProperty("publicStandalone").isPresent() && localSettings.exists()) {
    apply from: localSettings
}
